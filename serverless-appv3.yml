    #   Condition: LiveServerOnly
    #   Type: 'AWS::CloudWatch::Alarm'
    #   Properties:
    #     AlarmDescription: '${env:AppV3S3Bucket} - receives Total Error Rate HTTP status codes from CDN'
    #     Namespace: 'AWS/CloudFront'
    #     MetricName: TotalErrorRate
