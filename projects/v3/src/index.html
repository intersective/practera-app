<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Practera</title>
  <base href="/">
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="assets/icon/favicon.ico">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

</head>
<body>
  <app-root></app-root>
  <script>
    if (!location.host.startsWith('localhost:') && !location.host.startsWith('127.0.0.1:')) {
      (function () {
        var widgetEnabledClass = 'accessibility-widget-enabled';
        var script = document.createElement('script');
        var scriptContainer = document.querySelector('head') || document.body;

        document.body.classList.add(widgetEnabledClass);

        script.src = 'https://acsbapp.com/apps/app/dist/js/app.js';
        script.async = true;
        script.onerror = function () {
          document.body.classList.remove(widgetEnabledClass);
        };
        script.onload = function () {
          if (!window.acsbJS || typeof window.acsbJS.init !== 'function') {
            document.body.classList.remove(widgetEnabledClass);
            return;
          }

          try {
            window.acsbJS.init({
              statementLink: '',
              footerHtml: '',
              hideMobile: true,
              hideTrigger: true,
              disableBgProcess: false,
              language: 'en',
              position: 'left',
              leadColor: '#4d4d4d',
              triggerColor: '#4d4d4d',
              triggerRadius: '50%',
              triggerPositionX: 'left',
              triggerPositionY: 'bottom',
              triggerIcon: 'people',
              triggerSize: 'medium',
              triggerOffsetX: 15,
              triggerOffsetY: 40,
              mobile: {
                triggerSize: 'small',
                triggerPositionX: 'right',
                triggerPositionY: 'bottom',
                triggerOffsetX: 10,
                triggerOffsetY: 10,
                triggerRadius: '50%'
              }
            });
          } catch (error) {
            document.body.classList.remove(widgetEnabledClass);
          }
        };

        scriptContainer.appendChild(script);
      })();
    }
  </script>
</body>
</html>
