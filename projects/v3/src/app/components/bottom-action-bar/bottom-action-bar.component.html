<ion-footer class="wrapper">
  @switch (buttonType) {
    @case ('blocked-role') {
      <ion-text color="grey-50" class="ion-text-center"
        role="alert" aria-live="polite">
        <p i18n>Team assessment submissions restricted to participants only.</p>
      </ion-text>
    }
    @default {
      <div class="action-container">
        @if (hasCustomContent) {
          <ng-content></ng-content>
        }
        <div class="button-container"
          [class.is-loading]="loading"
          [ngClass]="{'with-custom-content': hasCustomContent}">
          <ion-button class="action-button"
            mode="ios"
            [disabled]="loading || (disabled$ | async)"
            [color]="color"
            [title]="title || null"
            (click)="onClick($event)"
            [attr.aria-busy]="loading ? 'true' : 'false'"
            type="button"
          >
            @if (loading) {
              <ion-spinner
                class="action-spinner"
                name="crescent"
                role="status"
                aria-live="polite"
                aria-label="Submitting"
                i18n-aria-label></ion-spinner>
            }
            <span>{{ text }}</span>
          </ion-button>
          @if (showResubmit === true) {
            <ion-button class="action-button"
              [disabled]="disabled$ | async"
              mode="ios"
              [color]="color"
              (click)="onResubmit($event)"
              [attr.aria-busy]="(disabled$ | async) ? 'true' : 'false'"
              type="button"
              i18n
            >Resubmit</ion-button>
          }
        </div>
      </div>
    }
  }
</ion-footer>
