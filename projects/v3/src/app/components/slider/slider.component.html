<h3 class="for-accessibility" [id]="'slider-question-' + question.id">{{question.name}}</h3>

<ng-container *ngIf="isDisplayOnly">
  <div class="likert-slider-container ion-padding display-only">
    <ion-range
      [min]="sliderMin"
      [max]="sliderMax"
      [step]="1"
      [snaps]="true"
      [ticks]="true"
      [pin]="true"
      [pinFormatter]="pinFormatter"
      [value]="submission?.answer"
      disabled
      [attr.aria-labelledby]="'slider-question-' + question.id"
      color="medium"
      class="likert-range display-only-slider">
    </ion-range>

    <div class="choice-labels display-only" *ngIf="generatedChoices.length">
      <div
        *ngFor="let choice of generatedChoices"
        class="choice-label"
        [ngClass]="{'selected': submission?.answer === choice.id}">
        <span [innerHTML]="choice.name"></span>
      </div>
    </div>

    <div class="answer-indicators" *ngIf="submission?.answer || review?.answer">
      <ion-chip class="label orange" *ngIf="submission?.answer" i18n>
        <ion-icon name="person" slot="start"></ion-icon>
        Learner answer: {{ getChoiceNameById(submission.answer) }}
      </ion-chip>
      <ion-chip class="label yellow black" *ngIf="review?.answer" i18n>
        <ion-icon name="school" slot="start"></ion-icon>
        Reviewer answer: {{ getChoiceNameById(review.answer) }}
      </ion-chip>
    </div>

    <ng-container *ngIf="review?.comment">
      <ion-card class="feedback-card">
        <ion-card-header>
          <ion-card-title class="feedback-title">
            <ion-icon name="eye" color="primary"></ion-icon>
            <span i18n>Expert Feedback</span>
          </ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <div class="feedback-content" [innerHTML]="review.comment"></div>
        </ion-card-content>
      </ion-card>
    </ng-container>
  </div>
</ng-container>

<ng-container *ngIf="doAssessment">
  <div class="likert-slider-container ion-padding">
    <ion-range
      #rangeEle
      [min]="sliderMin"
      [max]="sliderMax"
      [step]="1"
      [snaps]="true"
      [ticks]="true"
      [pin]="true"
      [pinFormatter]="pinFormatter"
      [value]="getSliderValue()"
      (ionInput)="onSliderChange($event)"
      [disabled]="control.disabled"
      [attr.aria-labelledby]="'slider-question-' + question.id"
      color="primary"
      class="likert-range">
    </ion-range>

    <div class="choice-labels" *ngIf="generatedChoices.length">
      <div
        *ngFor="let choice of generatedChoices; let i = index"
        class="choice-label"
        [ngClass]="{'selected': checkInnerValue(choice.id)}"
        (click)="onLabelClick(i)">
        <span [innerHTML]="choice.name"></span>
      </div>
    </div>

    <div class="validation-errors" *ngIf="errors.length > 0">
      <ion-item *ngFor="let error of errors" lines="none" class="error-item">
        <ion-icon name="alert-circle" color="danger" slot="start"></ion-icon>
        <ion-label color="danger">{{ error }}</ion-label>
      </ion-item>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="doReview">
  <div class="likert-slider-container ion-padding review-mode">
    <div class="participant-submission" *ngIf="submission?.answer && !question.reviewerOnly">
      <ion-card class="submission-card">
        <ion-card-header>
          <ion-card-subtitle>
            <ion-icon name="person" color="warning"></ion-icon>
            <span i18n>Learner's Submission</span>
          </ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <div class="readonly-slider-container">
            <ion-range
              [min]="sliderMin"
              [max]="sliderMax"
              [step]="1"
              [snaps]="true"
              [ticks]="true"
              [pin]="true"
              [pinFormatter]="pinFormatter"
              [value]="getSubmissionSliderValue()"
              disabled
              color="warning"
              class="likert-range readonly-slider">
            </ion-range>

            <div class="choice-labels readonly" *ngIf="generatedChoices.length">
              <div
                *ngFor="let choice of generatedChoices; let i = index"
                class="choice-label"
                [ngClass]="{'selected': submission?.answer === choice.id}">
                <span [innerHTML]="choice.name"></span>
              </div>
            </div>
          </div>
        </ion-card-content>
      </ion-card>
    </div>

    <div class="reviewer-answer" *ngIf="question.canAnswer">
      <ion-item class="review-header reviewer-section-header" lines="none" *ngIf="!question.reviewerOnly">
        <ion-label class="subtitle-2 black" i18n>Your Answer is</ion-label>
      </ion-item>

      <ion-range
        #reviewerRangeEle
        [min]="sliderMin"
        [max]="sliderMax"
        [step]="1"
        [snaps]="true"
        [ticks]="true"
        [pin]="true"
        [pinFormatter]="pinFormatter"
        [value]="getReviewSliderValue()"
        (ionInput)="onReviewSliderChange($event)"
        [disabled]="control.disabled"
        [attr.aria-labelledby]="'slider-question-' + question.id"
        color="primary"
        class="likert-range">
      </ion-range>

      <div class="choice-labels" *ngIf="generatedChoices.length">
        <div
          *ngFor="let choice of generatedChoices; let i = index"
          class="choice-label"
          [ngClass]="{'selected': checkReviewValue(choice.id)}"
          (click)="onReviewLabelClick(i)">
          <span [innerHTML]="choice.name"></span>
        </div>
      </div>
    </div>

    <div class="reviewer-comment" *ngIf="question.canComment && submission.answer">
      <ion-item class="comment-header" lines="none">
        <ion-label class="subtitle-2 black" i18n>Feedback</ion-label>
      </ion-item>
      <ion-textarea
        [autoGrow]="true"
        [attr.aria-label]="'expert\'s review feedback'"
        class="textarea review-textarea"
        [(ngModel)]="comment"
        rows="4"
        (ngModelChange)="onChange(comment, 'comment')"
        placeholder="Please put your feedback here"
        i18n-placeholder
        [disabled]="control.disabled">
      </ion-textarea>
    </div>

    <div class="validation-errors" *ngIf="errors.length > 0">
      <ion-item *ngFor="let error of errors" lines="none" class="error-item">
        <ion-icon name="alert-circle" color="danger" slot="start"></ion-icon>
        <ion-label color="danger">{{ error }}</ion-label>
      </ion-item>
    </div>
  </div>
</ng-container>
