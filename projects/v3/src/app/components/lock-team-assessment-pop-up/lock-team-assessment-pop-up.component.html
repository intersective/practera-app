<ion-content color="light" class="pop-up-content" [ngClass]="{'desktop-view': !isMobile}" text-center>

  <div class="image-content">
    <div class="image">
      <app-avatar [name]="name || 'User'" [avatarUrl]="image" size="lg"></app-avatar>
    </div>
  </div>

  <div class="details-container">
    <div class="div-after-img">
      @if (name) {
        <div class="description body-1">
          <b [innerHTML]="name"></b> <span class="gray-2" i18n>is currently editing this team submission. Click on</span> <b i18n>'View Read Only'</b> <span class="gray-2" i18n>to open in read only mode</span>.
        </div>
      }
    </div>

    <div class="div-after-img button-container">
      <ion-button mode="ios" (click)="confirmed()" shape="round" color="primary" expand="full" i18n>View Read Only</ion-button>
    </div>
  </div>

</ion-content>
