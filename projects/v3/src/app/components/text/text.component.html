<h3 class="for-accessibility" [id]="'text-question-' + question.id">{{question.name}}</h3>
<ng-container *ngIf="!doAssessment && !doReview && (submissionStatus === 'feedback available' || submissionStatus === 'pending review' || (submissionStatus === 'done' && reviewStatus === ''))">
  <div class="ion-no-padding ion-padding-horizontal" *ngIf="submission?.answer" role="region" aria-label="Submitted answer" i18n-aria-label>
    <ion-label class="white-space-normal body-2">
      <p *ngIf="!isReviewerFeedbackContext">
        <ion-chip class="label orange" role="status">
          <span i18n *ngIf="viewerRole === 'learner'">Your Answer</span>
          <span i18n *ngIf="viewerRole !== 'learner'">Learner's Answer</span>
        </ion-chip>
      </p>
      <p class="body-2 gray-3 white-space-pre black" [innerHTML]="submission?.answer | detectLanguage"></p>
    </ion-label>
  </div>

  <ng-container *ngIf="question.audience.includes('reviewer') && reviewStatus === 'done'">
    <ion-item lines="none">
      <ion-label class="white-space-normal body-2 gray-3">
        <p *ngIf="!isReviewerFeedbackContext"><ion-chip class="label yellow black" i18n role="status">Reviewer's Answer</ion-chip></p>
        <p class="body-2 gray-3 white-space-pre" [class]="{'noanswer': !review?.answer}" [innerHTML]="(review?.answer || 'No answer given to this optional question.') | detectLanguage"></p>
      </ion-label>
    </ion-item>
  </ng-container>

  <ng-container *ngIf="review?.comment && question.canComment === true">
    <ion-item class="feedback-title ion-no-padding" lines="none">
      <ion-icon class="ion-padding-horizontal" name="eye" size="small" aria-hidden="true"></ion-icon>
      <ion-label i18n class="white-space-normal">Feedback</ion-label>
    </ion-item>
    <ion-textarea class="ion-no-margin preview textarea white-space-pre"
      [autoGrow]="true"
      [value]="review.comment"
      [disabled]="true"
      aria-label="Expert feedback" i18n-aria-label
      readonly
    ></ion-textarea>
  </ng-container>
</ng-container>

<ng-container *ngIf="doAssessment">
  <div class="ion-padding textarea-border">
    <ion-textarea
      [autoGrow]="true"
      [attr.aria-labelledby]="'text-question-' + question.id"
      [(ngModel)]="answer"
      #answerEle
      rows="4"
      class="textarea"
      (ionFocus)="onFocus($event)"
      (keyup)="onChange()"
      [disabled]="control?.disabled"
      [attr.aria-required]="question.isRequired"
      [attr.aria-invalid]="control?.invalid && control?.touched"
      class="ion-no-margin"
      placeholder="Please add your answer here"
      i18n-placeholder
    ></ion-textarea>
    <div role="alert" aria-live="assertive" aria-atomic="true" *ngIf="errors.length > 0">
      <ion-text *ngFor="let error of errors" color="danger">
        <p>{{error}}</p>
      </ion-text>
    </div>
  </div>
</ng-container>

<ng-container *ngIf="doReview">
  <ion-item *ngIf="!submission?.answer && !question.reviewerOnly" class="no-answers item-bottom-border" lines="none" role="alert">
    <ion-icon slot="start" color="danger" name="warning-outline" aria-hidden="true"></ion-icon>
    <ion-label size="small" i18n>No answers were submitted.</ion-label>
  </ion-item>

  <div class="ion-padding-horizontal ion-padding-bottom" *ngIf="submission?.answer" role="region" aria-label="Learner submission" i18n-aria-label>
    <h4 class="for-accessibility" id="learner-indicator">Learner's Answer</h4>
    <ion-chip class="label orange" aria-hidden="true" i18n>Learner's Answer</ion-chip>
    <p id="learner-answer" class="body-2 gray-3 white-space-pre" [innerHTML]="submission?.answer | detectLanguage" aria-labelledby="learner-indicator"></p>
  </div>

  <div class="ion-no-padding">
    <ion-list class="ion-no-padding ion-padding-bottom" *ngIf="question.canAnswer">
      <ion-list-header class="ion-no-padding" *ngIf="!question.reviewerOnly">
        <ion-label class="subtitle-2 black" i18n>Your Answer is</ion-label>
      </ion-list-header>

      <div [class]="{'ion-padding-top': question.reviewerOnly}">
        <ion-textarea
          [autoGrow]="true"
          [attr.aria-label]="'Reviewer\'s answer'" i18n-aria-label
          *ngIf="question.canAnswer"
          class="textarea"
          rows="4"
          [(ngModel)]="answer"
          #answerEle
          (ionFocus)="onFocus($event)"
          (keyup)="onChange('answer')"
          placeholder="Please put your answer here"
          i18n-placeholder
          [disabled]="control.disabled"
          [attr.aria-required]="question.isRequired"
          [attr.aria-invalid]="control?.invalid && control?.touched"
        ></ion-textarea>
      </div>
    </ion-list>

    <ion-list class="ion-no-padding ion-padding-bottom" *ngIf="question.canComment && submission.answer">
      <ion-list-header class="ion-no-padding" lines="none">
        <ion-label class="subtitle-2 black" i18n>Feedback</ion-label>
      </ion-list-header>

      <ion-textarea
        [autoGrow]="true"
        [attr.aria-label]="'Expert review feedback'" i18n-aria-label
        *ngIf="question.canComment && submission?.answer"
        class="textarea"
        [(ngModel)]="comment"
        #commentEle
        rows="4"
        (ionFocus)="onFocus($event)"
        (keyup)="onChange('comment')"
        placeholder="Please put your feedback here"
        i18n-placeholder
        [disabled]="control.disabled"
      ></ion-textarea>
    </ion-list>

  </div>
</ng-container>
