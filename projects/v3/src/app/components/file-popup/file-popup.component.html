<ion-header mode="ios">
  <ion-toolbar>
    <ion-icon *ngIf="file?.url"
      name="download"
      (click)="download()"
      (keydown)="download($event)"
      color="primary"
      size="large"
      slot="end"
      margin-start
      role="button"
      tabindex="0"
      aria-label="download"
    ></ion-icon>

    <ion-icon name="close-circle-outline"
      (click)="close()"
      (keydown)="close($event)"
      color="primary"
      size="large"
      slot="end"
      margin-start
      role="button"
      tabindex="0"
      aria-label="close preview"
    ></ion-icon>
  </ion-toolbar>
</ion-header>

<ion-content text-center>
  <div class="wrapper">
    <ng-container *ngIf="file?.type.includes('image')">
      <img [src]="file.url" alt="uploaded attachment preview" i18n-alt>
    </ng-container>

    <ng-container *ngIf="file?.type.includes('video')">
      <video
        width="100%"
        controls
        controlsList="nodownload"
        preload="metadata"
        playsinline
        [src]="file.url"
        (error)="handleVideoError($event)"
      >
        <p i18n="video not supported message">
          Your browser doesn't support HTML5 video.
          Here is a <a [href]="file.url">link to the video</a> instead.
        </p>
      </video>
    </ng-container>
  </div>
</ion-content>
