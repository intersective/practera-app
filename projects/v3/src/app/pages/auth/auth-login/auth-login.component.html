<ion-content color="light" class="ion-text-center">
  <header>
    <div class="div-logo">
      <app-branding-logo></app-branding-logo>
    </div>
  </header>
  <main aria-label="login">
    <div class="div-after-logo">
      <form (ngSubmit)="login()" [formGroup]="loginForm" (keyup.enter)="login()">
        <ion-list class="ion-margin">
          <ion-item>
            <ion-label position="stacked" for="login-email">Email</ion-label>
            <ion-input
              id="login-email"
              name="email"
              formControlName="email"
              required
              autocomplete="email"
              inputmode="email"
              type="email"
              placeholder="Email"
              i18n-placeholder
              autofocus="true"
              ></ion-input>
          </ion-item>
          <ion-item lines="none">
            <ion-label position="stacked" for="login-password">Password</ion-label>
            <ion-input
              id="login-password"
              name="password"
              formControlName="password"
              autocomplete="current-password"
              required
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Password"
              i18n-placeholder
              ></ion-input>
              <ion-button (click)="showPassword = !showPassword" fill="clear" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                <ion-icon slot="end" [name]="showPassword ? 'eye' : 'eye-off'" aria-hidden="true"></ion-icon>
              </ion-button>
          </ion-item>
        </ion-list>
        <ion-button
          shape="round"
          color="primary"
          [disabled]="!loginForm.valid || isLoggingIn"
          type="submit"
          expand="full"
          tabindex="0"
          [attr.aria-describedby]="'login-desc'"
          (keydown)="login($event)"
          >
          <ng-container *ngIf="!isLoggingIn" id="login-desc" i18n>LOGIN</ng-container>
          <ng-container *ngIf="isLoggingIn" id="login-desc" i18n>LOGGING IN...</ng-container>
        </ion-button>
      </form>
    </div>
    <div class="text-split">
      <a routerLink="/auth/forgot_password" class="subtitle-2" i18n>Problem signing in?</a>
    </div>
    <div>
      <a i18n>Powered by</a><img src="./assets/logo.svg" height="25" class="img-inline" alt="Practera">
    </div>
  </main>
</ion-content>
