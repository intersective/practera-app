<ion-header class="ion-no-border header-border" aria-label="reviews">
  <ion-toolbar>
    <ion-title class="headline-4 grey-75" i18n>Reviews</ion-title>
    <ion-buttons slot="end">
      <app-personalised-header></app-personalised-header>
    </ion-buttons>
  </ion-toolbar>
  @if (loading === true) {
    <ion-progress-bar type="indeterminate"></ion-progress-bar>
  }
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="4" class="border-right">
        <app-review-list
          [reviews]="reviews"
          [currentReview]="currentReview"
          [goToFirstOnSwitch]="currentReview === undefined ? true : false"
          (navigate)="goto($event)"
        ></app-review-list>
      </ion-col>

      <ion-col size="12" size-md="8">
        @if (!noReview) {
          <app-assessment
            [assessment]="assessment"
            [submission]="submission"
            [review]="review"
            [savingMessage$]="savingText$"
            [btnDisabled$]="btnDisabled$"
            action="review"
            (save)="saveReview($event)"
            tabindex="0"
            id="task-content"
          ></app-assessment>
        }

        @if (noReview) {
          <div class="ion-text-center no-review">
            <ion-icon class="large-icon" color="primary" name="clipboard-outline"></ion-icon>
            <p class="headline-2" i18n>It's empty here.</p>
            <ion-text class="subtitle-2" color="grey-75" i18n>Oops! Seems like there's nothing in this yet.</ion-text>
          </div>
        }
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
