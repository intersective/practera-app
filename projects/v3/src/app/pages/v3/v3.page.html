<ion-split-pane contentId="main-content-router" [when]="splitpaneEnabled">
  <ion-menu id="main-navigation"
    contentId="main-content-router"
    swipeGesture="false"
    [ngClass]="{'collapsed': isMenuOpen === false}"
    [@openClose]="collapsibleMenu"
    (@openClose.done)="direction()">

    <ion-content>
      <h1 class="for-accessibility">Side menu</h1>
      <div class="institute-logo-container" [ngClass]="{'hidden': !institutionLogo}">
        <img [src]="institutionLogo" [attr.alt]="institutionName">
      </div>

      <ion-list lines="none">
        <ion-menu-toggle autoHide="false"
          *ngFor="let p of appPages; let i = index">
          <ion-item class="menu-item tooltip"
            *ngIf="isVisible(p.code)"
            routerLinkActive="selected"
            detail="false"
            [title]="p.title"
            lines="none">
            <a [routerLink]="p.url"
               routerDirection="root"
               (keydown)="keyboardNavigate(p.url, $event)"
               [attr.aria-label]="p.title + (p.badges > 0 ? ', ' + p.badges + ' unread' : '')"
               class="menu-link">
              <div class="badge-wrapper icon-container">
                <ion-icon slot="start" [name]="p.icon" aria-hidden="true" class="indicator"></ion-icon>
                <ion-badge color="danger" class="hint" *ngIf="p.badges > 0" aria-hidden="true">{{p.badges}}</ion-badge>
                <span class="notification-dot" [class.hidden]="!p.hasNotification"></span>
              </div>

              <ion-label class="body-2 black">
                {{p.title}}
              </ion-label>
            </a>
          </ion-item>
        </ion-menu-toggle>
