<ion-tabs #tabs (ionTabsDidChange)="setCurrentTab()">
  <ion-tab-bar slot="bottom" *ngIf="hasLeftSidebar !== true">
    <ion-tab-button class="tab-item" tab="home"
      [ngClass]="{'selected': selectedTab === 'home'}"
      (keydown)="keyboardNavigateTab('home', $event)"
      aria-label="Home" i18n-aria-label>
      <ion-icon name="home" aria-hidden="true"></ion-icon>
    </ion-tab-button>

    <ion-tab-button class="tab-item" tab="events"
      [ngClass]="{'selected': selectedTab === 'events'}" *ngIf="showEvents"
      (keydown)="keyboardNavigateTab('events', $event)"
      aria-label="Events" i18n-aria-label>
      <ion-icon name="today" aria-hidden="true"></ion-icon>
    </ion-tab-button>

    <ion-tab-button class="tab-item" tab="reviews"
      [ngClass]="{'selected': selectedTab === 'reviews'}" *ngIf="reviews && reviews.length"
      (keydown)="keyboardNavigateTab('reviews', $event)"
      [attr.aria-label]="'Reviews' + (badges.review > 0 ? ', ' + badges.review + ' unread' : '')" i18n-aria-label>
      <ion-icon name="eye" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="badges.review > 0" aria-hidden="true">{{ badges.review }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button class="tab-item" tab="messages" *ngIf="showMessages === true"
      [ngClass]="{'selected': selectedTab === 'messages'}"
      (keydown)="keyboardNavigateTab('messages', $event)"
      [attr.aria-label]="'Messages' + (badges.chat > 0 ? ', ' + badges.chat + ' unread' : '')" i18n-aria-label>
      <ion-icon name="mail" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="badges.chat > 0" aria-hidden="true">{{ badges.chat }}</ion-badge>
    </ion-tab-button>

    <ion-tab-button class="tab-item" tab="due-dates"
      [ngClass]="{'selected': selectedTab === 'dueStatus'}"
      (keydown)="keyboardNavigateTab('due-dates', $event)"
      aria-label="Due Status" i18n-aria-label>
      <ion-icon name="alarm" aria-hidden="true"></ion-icon>
    </ion-tab-button>

    <ion-tab-button class="tab-item" tab="settings"
      [ngClass]="{'selected': selectedTab === 'settings'}"
      (keydown)="keyboardNavigateTab('settings', $event)"
      aria-label="Settings" i18n-aria-label>
      <ion-icon name="settings" aria-hidden="true"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
