<ng-container [ngSwitch]="type">
  <ng-container *ngSwitchCase="'profileImage'">
    <button 
      type="button"
      class="upload-icon"
      (click)="uploadFile()"
      (keydown.enter)="uploadFile()"
      (keydown.space)="uploadFile(); $event.preventDefault()"
      aria-label="Upload profile image"
      [disabled]="disabled">
      <ion-icon name="camera-outline" aria-hidden="true"></ion-icon>
    </button>
  </ng-container>

  <ng-container *ngSwitchDefault>
    <ng-container *ngIf="utils.isMobile()">
      <ion-button size="small" class="upload-button" shape="round" (click)="uploadFile()" [disabled]="disabled">UPLOAD FILE</ion-button>
    </ng-container>
    <ng-container *ngIf="!utils.isMobile()">
      <div *ngIf="!isDroped" class="drop-zone" appDragAndDrop (fileDropped)="dragAndDropUpload($event)"
        [acceptFileType]="fileType" [disabled]="disabled">
        <p class="gray-2 subtitle-1">
          <ion-icon name="cloud-upload-outline" aria-hidden="true"></ion-icon> Drag and drop file here or
          <ion-button size="small" class="upload-button" shape="round" (click)="uploadFile()" [disabled]="disabled" aria-label="Upload file">UPLOAD FILE</ion-button>
        </p>
      </div>
      <div *ngIf="isDroped" class="upload-progress">
        <ion-grid>
          <ion-row>
            <ion-col size="1" class="fileTypeIcon">
              <ng-container [ngSwitch]="fileType">
                <ng-container *ngSwitchCase="'video'">
                  <ion-icon name="film-outline" aria-hidden="true"></ion-icon>
                </ng-container>
                <ng-container *ngSwitchCase="'image'">
                  <ion-icon name="image-outline" aria-hidden="true"></ion-icon>
                </ng-container>
                <ng-container *ngSwitchDefault>
                  <ion-icon name="document-outline" aria-hidden="true"></ion-icon>
                </ng-container>
              </ng-container>
            </ion-col>
            <ion-col size="11">
              <ion-grid>
                <ion-row>
                  <ion-col size="11" class="file-name-container">
                    <p class="black subtitle-1">{{ uploadingFile.fileName }}</p>
                  </ion-col>
                  <ion-col size="1" class="cancel-btn-container">
                    <ion-button 
                      size="small" 
                      fill="clear" 
                      class="cancel-btn" 
                      (click)="cancelFileUpload()"
                      (keydown.enter)="cancelFileUpload()"
                      (keydown.space)="cancelFileUpload(); $event.preventDefault()"
                      aria-label="Cancel file upload">
                      <ion-icon slot="icon-only" name="close-outline" aria-hidden="true"></ion-icon>
                    </ion-button>
                  </ion-col>
                </ion-row>
                <ion-row>
                  <ion-col size="12">
                    <ion-progress-bar color="primary" value="{{ (uploadingFile.uploadProgress) / 100 }}" mode="ios">
                    </ion-progress-bar>
                  </ion-col>
                </ion-row>
                <ion-row class="size-and-progress">
                  <ion-col size="6" class="file-size-container">
                    <p class="file-size caption gray-2" role="status" aria-live="polite">{{ uploadingFile.uploadSize }} of {{ uploadingFile.fileSize }}
                    </p>
                  </ion-col>
                  <ion-col size="6" class="file-progress-container">
                    <p class="file-upload-progress caption gray-2" role="status" aria-live="polite" [attr.aria-label]="'Upload progress: ' + uploadingFile.uploadProgress + ' percent'">{{ uploadingFile.uploadProgress }}%</p>
                  </ion-col>
                </ion-row>
              </ion-grid>
            </ion-col>
          </ion-row>
        </ion-grid>
      </div>
    </ng-container>
  </ng-container>
</ng-container>
