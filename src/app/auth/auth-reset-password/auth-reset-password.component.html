<ion-content color="light" class="ion-text-center" *ngIf="verifySuccess">
  <div class="div-logo">
    <app-branding-logo></app-branding-logo>
  </div>
  <div class="div-after-logo">
    <div class="text-split">
      <p><b>Reset your password</b></p>
      <p>Please enter a new password for your account.</p>
    </div>
    <form (ngSubmit)="resetPassword()" [formGroup]="resetPasswordForm">
      <p class="body-2 gray-2 ion-margin-bottom" aria-live="polite">
        Fields marked with <span class="required-indicator" aria-label="required">*</span> are required.
      </p>
      <ion-input name="username" formControlName="email" type="email" aria-hidden="true" class="for-accessibility"></ion-input>
      <ion-list>
        <ion-item>
          <ion-label position="stacked" for="reset-password">Password</ion-label>
          <ion-input
            id="reset-password"
            name="password"
            autocomplete="new-password"
            inputmode="password"
            formControlName="password"
            required
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Password"
            [attr.aria-describedby]="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.password.value ? 'password-error' : null"
            [attr.aria-invalid]="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.password.value ? 'true' : null"></ion-input>
          <ion-button 
            (click)="showPassword = !showPassword" 
            fill="clear"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            type="button">
            <ion-icon slot="end" [name]="showPassword ? 'eye' : 'eye-off'" aria-hidden="true"></ion-icon>
          </ion-button>
        </ion-item>
        <ion-item>
          <ion-label position="stacked" for="reset-confirm-password">Confirm Password</ion-label>
          <ion-input
            id="reset-confirm-password"
            name="confirmPassword"
            autocomplete="new-password"
            inputmode="password"
            formControlName="confirmPassword"
            [type]="showPassword ? 'text' : 'password'"
            placeholder="Verify"
            [class.invalid-field]="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.confirmPassword.value"
            [attr.aria-describedby]="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.confirmPassword.value ? 'password-error' : null"
            [attr.aria-invalid]="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.confirmPassword.value ? 'true' : null"></ion-input>
        </ion-item>
      </ion-list>
      <ion-text 
        id="password-error"
        color="danger" 
        class="ion-margin-top" 
        role="alert"
        aria-live="polite"
        *ngIf="resetPasswordForm.hasError('notMatching') && resetPasswordForm.controls.confirmPassword.value">
        Password do not match
      </ion-text>
      <br/>
      <ion-button shape="round" color="primary" [disabled]="!resetPasswordForm.valid || isResetting" type="submit">
        <ng-container *ngIf="!isResetting">CHANGE PASSWORD</ng-container>
        <ng-container *ngIf="isResetting">RESETTING...</ng-container>
      </ion-button>
    </form>
    <div class="text-split">
      <span><ion-text class="ion-margin-end"> Remembered it?</ion-text></span>
      <a routerLink="/login">Login here</a>
    </div>
    <div>
      <a>Powered by</a><img src="/assets/logo.svg" height="25" class="img-inline" alt="Practera">
    </div>
  </div>
</ion-content>
