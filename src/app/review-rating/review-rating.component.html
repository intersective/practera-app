<ion-content class="review-rating ion-padding-horizontal">
  <div class="header-detail">
    <h1 class="title">Rating</h1>
    <!-- AV2-169 review rating is compulsory -->
   <!--  <ion-icon class="close-button" name="close-circle-outline" (click)="closeReviewRating()"></ion-icon> -->
  </div>

  <hr class="separator">

  <h2 class="title">How helpful was the feedback?</h2>

  <div>
    <ion-label position="stacked" for="rating-range" class="for-accessibility">Feedback helpfulness rating</ion-label>
    <ion-range 
      id="rating-range"
      mode="ios" 
      min="0" 
      max="1" 
      step="0.1" 
      snaps="true" 
      [(ngModel)]="ratingData.rating"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="1"
      [attr.aria-valuenow]="ratingData.rating"
      [attr.aria-valuetext]="ratingData.rating === 0.5 ? 'Neutral' : (ratingData.rating < 0.5 ? 'Not helpful' : 'Very helpful')"
      aria-label="Rate feedback helpfulness"></ion-range>

    <div class="range-text" role="group" aria-label="Rating scale">
      <p>Not helpful</p>
      <p>Very helpful</p>
    </div>
  </div>

  <hr *ngIf="ratingData.rating !== 0.5" class="separator">
  <h2 *ngIf="ratingData.rating !== 0.5" class="subTitle">Send a quick thank you note!</h2>
  <div *ngIf="ratingData.rating !== 0.5" class="quick-tagging" role="group" aria-label="Thank you tags">
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('Thanks')" 
      (click)="addOrRemoveTags('Thanks')"
      (keydown.enter)="addOrRemoveTags('Thanks')"
      (keydown.space)="addOrRemoveTags('Thanks'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('Thanks')">Thanks</button>
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('Thank You')" 
      (click)="addOrRemoveTags('Thank You')"
      (keydown.enter)="addOrRemoveTags('Thank You')"
      (keydown.space)="addOrRemoveTags('Thank You'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('Thank You')">Thank You</button>
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('You are awesome!')" 
      (click)="addOrRemoveTags('You are awesome!')"
      (keydown.enter)="addOrRemoveTags('You are awesome!')"
      (keydown.space)="addOrRemoveTags('You are awesome!'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('You are awesome!')">You are awesome!</button>
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('Great support')" 
      (click)="addOrRemoveTags('Great support')"
      (keydown.enter)="addOrRemoveTags('Great support')"
      (keydown.space)="addOrRemoveTags('Great support'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('Great support')">Great support</button>
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('Very helpful')" 
      (click)="addOrRemoveTags('Very helpful')"
      (keydown.enter)="addOrRemoveTags('Very helpful')"
      (keydown.space)="addOrRemoveTags('Very helpful'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('Very helpful')">Very helpful</button>
    <button 
      type="button"
      class="toggle" 
      [class.active]="ratingData.tags.includes('Friendly')" 
      (click)="addOrRemoveTags('Friendly')"
      (keydown.enter)="addOrRemoveTags('Friendly')"
      (keydown.space)="addOrRemoveTags('Friendly'); $event.preventDefault()"
      [attr.aria-pressed]="ratingData.tags.includes('Friendly')">Friendly</button>
  </div>
  <br>

  <ion-label position="stacked" for="rating-comment" *ngIf="ratingData.rating !== 0.5" class="for-accessibility">Personal thank you note</ion-label>
  <ion-input 
    *ngIf="ratingData.rating !== 0.5" 
    id="rating-comment"
    placeholder="Add a personal thank you" 
    class="comment-box ion-padding-horizontal" 
    [(ngModel)]="ratingData.comment"></ion-input>

  <br>
  <div class="div-after-logo ion-text-center">
    <ion-button
      [disabled]="ratingData.rating === 0.5 || isSubmitting"
      (click)="submitReviewRating()"
      shape="round"
      class="btn-cta">
      <ng-container *ngIf="!isSubmitting">Submit</ng-container>
      <ng-container *ngIf="isSubmitting">Submitting...</ng-container>
    </ion-button>
  </div>
</ion-content>
