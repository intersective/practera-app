<ion-tabs>

  <ion-tab-bar *ngIf="utils.isMobile() && !restrictedAccess" slot="bottom" role="tablist">

    <ion-tab-button 
      layout="icon-top" 
      tab="home" 
      [class.selected]="selectedTab == 'overview'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'overview'"
      [attr.aria-controls]="selectedTab == 'overview' ? 'home-panel' : null"
      aria-label="Home tab">
      <ion-icon class="gray-2" name="home-outline" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="noOfTodoItems > 0" [attr.aria-label]="noOfTodoItems + ' new notifications'">{{ noOfTodoItems }}</ion-badge>
      <ion-label class="gray-2">Home</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showEvents" 
      tab="events" 
      [class.selected]="selectedTab == 'events'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'events'"
      [attr.aria-controls]="selectedTab == 'events' ? 'events-panel' : null"
      aria-label="Events tab">
      <ion-icon class="gray-2" name="calendar-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2">Events</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showReview" 
      tab="reviews" 
      [class.selected]="selectedTab == 'reviews'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'reviews'"
      [attr.aria-controls]="selectedTab == 'reviews' ? 'reviews-panel' : null"
      aria-label="Review tab">
      <ion-icon class="gray-2" name="clipboard-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2">Review</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showChat" 
      tab="chat" 
      [class.selected]="selectedTab == 'chat'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'chat'"
      [attr.aria-controls]="selectedTab == 'chat' ? 'chat-panel' : null"
      aria-label="Chat tab">
      <ion-icon class="gray-2" name="chatbubbles-outline" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="noOfChats > 0" [attr.aria-label]="noOfChats + ' unread messages'">{{ noOfChats }}</ion-badge>
      <ion-label class="gray-2">Chat</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      tab="settings" 
      [class.selected]="selectedTab == 'settings'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'settings'"
      [attr.aria-controls]="selectedTab == 'settings' ? 'settings-panel' : null"
      aria-label="Settings tab">
      <ion-icon class="gray-2" name="settings-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2">Settings</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

  <ion-tab-bar *ngIf="!utils.isMobile() && !restrictedAccess" slot="top" role="tablist">

    <ion-tab-button 
      layout="icon-top" 
      tab="home" 
      [class.selected]="selectedTab == 'overview'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'overview'"
      [attr.aria-controls]="selectedTab == 'overview' ? 'home-panel' : null"
      aria-labelledby="home-label">
      <ion-icon class="gray-2" name="home-outline" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="noOfTodoItems > 0" [attr.aria-label]="noOfTodoItems + ' new notifications'">{{
        noOfTodoItems }}</ion-badge>
      <ion-label class="gray-2" id="home-label">Home</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showEvents" 
      tab="events" 
      [class.selected]="selectedTab == 'events'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'events'"
      [attr.aria-controls]="selectedTab == 'events' ? 'events-panel' : null"
      aria-labelledby="event-label">
      <ion-icon class="gray-2" name="calendar-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2" id="event-label">Events</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showReview" 
      tab="reviews" 
      [class.selected]="selectedTab == 'reviews'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'reviews'"
      [attr.aria-controls]="selectedTab == 'reviews' ? 'reviews-panel' : null"
      aria-label="Review tab">
      <ion-icon class="gray-2" name="clipboard-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2">Review</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      *ngIf="showChat" 
      tab="chat" 
      [class.selected]="selectedTab == 'chat'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'chat'"
      [attr.aria-controls]="selectedTab == 'chat' ? 'chat-panel' : null"
      aria-label="Chat tab">
      <ion-icon class="gray-2" name="chatbubbles-outline" aria-hidden="true"></ion-icon>
      <ion-badge color="danger" *ngIf="noOfChats > 0" [attr.aria-label]="noOfChats + ' unread messages'">{{ noOfChats }}</ion-badge>
      <ion-label class="gray-2">Chat</ion-label>
    </ion-tab-button>

    <ion-tab-button 
      layout="icon-top" 
      tab="settings" 
      [class.selected]="selectedTab == 'settings'"
      role="tab"
      [attr.aria-selected]="selectedTab == 'settings'"
      [attr.aria-controls]="selectedTab == 'settings' ? 'settings-panel' : null"
      aria-label="Settings tab">
      <ion-icon class="gray-2" name="settings-outline" aria-hidden="true"></ion-icon>
      <ion-label class="gray-2">Settings</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
