AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for the static Preview learner SPA. No ECS, ALB, or NAT.

Parameters:
  AppHostname:
    Type: String
    Default: app.preview.practera.com
  UseCustomDomain:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: Keep the issued certificate and the child-zone alias. Set this to false only to remove the alias. This does not delegate the parent zone.
  ExistingCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:836884247349:certificate/4f972768-5f08-42f1-a399-19900d78e17a
    Description: Issued certificate that already covers this hostname. This template does not request a certificate.
  PublicHostedZoneId:
    Type: String
    Default: Z044937529XQ8HDJT7DWF
  AssetBucketName:
    Type: String
    Default: practera-preview-learner-836884247349

Conditions:
  UseCustomDomain: !And
    - !Equals [!Ref UseCustomDomain, 'true']
    - !Not [!Equals [!Ref ExistingCertificateArn, '']]

Resources:
  AssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref AssetBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: StackName
          Value: practera-preview
        - Key: Env
          Value: dev
        - Key: Service
          Value: learner-app

  AssetBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AssetBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt AssetBucket.Arn
              - !Sub '${AssetBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-learner-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-learner-headers'
        Comment: Baseline headers for the static learner origin. This distribution does not proxy API responses.
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Override: true
            Preload: false
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'self'; base-uri 'self'; object-src 'none';
              frame-ancestors 'none'; script-src 'self' https://unpkg.com;
              style-src 'self' 'unsafe-inline'; font-src 'self' data:;
              img-src 'self' data: blob: https:; worker-src 'self' blob:;
              connect-src 'self' https: wss:

  SpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-learner-spa'
      AutoPublish: true
      FunctionConfig:
        Comment: Send extensionless routes to index.html. Leave hashed files alone.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith('/')) {
            request.uri = '/index.html';
          } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: practera-preview learner static SPA
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        DefaultRootObject: index.html
        Aliases: !If [UseCustomDomain, [!Ref AppHostname], !Ref AWS::NoValue]
        Origins:
          - Id: learner-assets
            DomainName: !GetAtt AssetBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: learner-assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewrite.FunctionARN
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: learner-assets
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            ResponseHeadersPolicyId: !Ref SecurityHeaders
        ViewerCertificate: !If
          - UseCustomDomain
          - AcmCertificateArn: !Ref ExistingCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: StackName
          Value: practera-preview
        - Key: Env
          Value: dev
        - Key: Service
          Value: learner-app

  AppAliasA:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomDomain
    Properties:
      HostedZoneId: !Ref PublicHostedZoneId
      Name: !Ref AppHostname
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  AppAliasAAAA:
    Type: AWS::Route53::RecordSet
    Condition: UseCustomDomain
    Properties:
      HostedZoneId: !Ref PublicHostedZoneId
      Name: !Ref AppHostname
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-learner-5xx'
      AlarmDescription: CloudFront 5xx rate for the static learner distribution. Uses the included CloudFront metric.
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref Distribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  AssetBucketName:
    Value: !Ref AssetBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
  AppHostname:
    Condition: UseCustomDomain
    Value: !Ref AppHostname
