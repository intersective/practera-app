version: '3.8'

# =============================================================================
# App V2 - Standalone Development Configuration
# =============================================================================
# Use this for standalone development of app-v2
# For full-stack development, use practera-devpod/docker-compose.yml
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    ports:
      - "4200:4200"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - API_URL=http://core-graphql-api:8000
    volumes:
      - .:/app:cached
      - node_modules:/app/node_modules
    networks:
      - practera-dev

volumes:
  node_modules:

networks:
  practera-dev:
    name: practera-dev
    external: true
